<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puntuación del nombre</title>
    <meta name="description" content="Puntuación de un nombre: anonimato, tildes, Cumpleaños feliz, escritura, uso actual y emails con vuestros apellidos." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/nunito-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/name.js"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true"><span class="cloud cloud-sky"></span><span class="cloud cloud-pink"></span><span class="cloud cloud-lilac"></span></div>

    <main class="page">
      <div class="topbar">
        <a class="back" id="back" href="/" data-i18n="back">Volver a la lista</a>
        <nav class="toggle lang" aria-label="Idioma / Language">
          <button type="button" data-lang="es" aria-pressed="true">ES</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </nav>
      </div>

      <header class="hero">
        <p class="song">
          <span class="song-line" data-i18n="songLine">Cumpleaños feliz, querida</span>
          <span class="song-name" id="song-name"></span>
        </p>
      </header>

      <div id="status" role="status" aria-live="polite"></div>

      <article class="detail" id="detail" hidden>
        <section class="total glass">
          <div class="total-score">
            <span class="total-number" id="total-number"></span>
            <span class="total-label" data-i18n="totalScore">Puntuación total</span>
          </div>
          <p id="place"></p>
        </section>

        <section>
          <h2 data-i18n="criteriaTitle">Cómo se calcula</h2>
          <ul class="criteria" id="criteria"></ul>
        </section>

        <section>
          <h2 data-i18n="factsTitle">Datos</h2>
          <dl class="facts glass" id="facts"></dl>
        </section>

        <section>
          <h2 id="handles-title"></h2>
          <div id="handles"></div>
        </section>
      </article>

      <footer class="footer">
        <p id="source"></p>
        <p><a href="https://github.com/gonzaloacosta/ine-name-score-for-dev-parents" data-i18n="code">Código en GitHub</a></p>
      </footer>
    </main>
  </body>
</html>
