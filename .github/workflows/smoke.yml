name: Smoke

# Runs when Vercel reports a finished deployment. Only production is checked:
# preview and per-deployment URLs sit behind Vercel Deployment Protection (401).
on: deployment_status

permissions: {}

jobs:
  production:
    name: production smoke
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.PRODUCTION_URL || 'https://ine-name-score-for-dev-parents.vercel.app' }}
    steps:
      - name: API health
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$BASE_URL/api/health" | jq -e '.status == "ok"'

      - name: API ranking
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 "$BASE_URL/api/rank?top=3" \
            | jq -e '(.names | length) == 3 and (.data.census_date | type) == "string"'

      - name: Frontend and security headers
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 5 -D headers.txt -o index.html "$BASE_URL/"
          grep -q 'src="/app.js"' index.html
          grep -qi '^content-security-policy:' headers.txt
